[package]
name = "envpilot"
edition.workspace = true
license.workspace = true
version.workspace = true

[[bin]]
name = "envpilot"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
envpilot-core = { path = "../envpilot-core" }
serde_json = "1"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
